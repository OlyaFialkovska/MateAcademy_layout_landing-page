  <body class="page__body">
    <!-- #region header -->
    <header class="header">
      <div class="top-bar">
        <a href="#" class="top-bar__logo-link">
          <img

            src="src/images/my-bike-logo-white.svg"

        <div class="top-bar__icons">
          <div class="top-bar__phone">
            <a href="#" class="icon icon--phone"></a>
            <a
              href="tel:+1 234 555-55-55"
              class="top-bar__phone-number">
              +1 234 555-55-55
            </a>
          </div>

          <a href="#menu" class="icon icon--menu"></a>
        </div>
      </div>

      <div class="header__bottom">
        <h1 class="header__title">Take the Streets</h1>
      </div>
    </header>

    <!-- #region aside -->
    <aside class="page__menu menu" id="menu">
      <div class="top-bar menu__top-bar">
        <a href="#" class="top-bar__logo">
          <img src="src/images/my-bike-logo-dark.svg" alt="MyBIKE logo">

        <a href="#" class="icon icon--close"></a>

      <div class="menu__content">
        <nav class="menu__nav nav">
          <ul class="nav__list">
            <li class="nav__item">

            <li class="nav__item">

            </li>
            <li class="nav__item">
              <a href="#contacts" class="nav__link">Contacts</a>
            </li>
          </ul>
        </nav>


        <a class="menu__phone-number" href="#phone-number">+1 234 5555-55-55</a>
        <a class="menu__book-a-test-ride" href="#contacts">Book a test ride</a>

      </div>
    </aside>
    <!-- #endregion -->

    <!-- #region main -->
    <main class="page__main">
      <section class="move-free" id="about-us">
        <h2>Move Free</h2>
      </section>

      <section class="compare-bikes" id="compare-bikes">
        <h2>Compare bikes</h2>
      </section>

      <section class="the-details" id="details">
        <h2>The details</h2>
      </section>

      <section class="contact-us" id="contacts">
